<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase – Viikko 4</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            color: #222;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff9800;
        }

        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #e68900;
        }

        li {
            margin: 10px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Firebase – Viikko 4</h1>

    <p>
        Tämä sivu käyttää Firebase Realtime Databasea
        tietojen hakemiseen sekä tallentamiseemn.
    </p>

    <input id="messageInput" type="text" placeholder="Kirjoita viesti">

    <button onclick="saveMessage()">Tallenna</button>

    <h2>Tallennetut viestit</h2>

    <ul id="messageList"></ul>

</div>

<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        push,
        onValue
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    const firebaseConfig = {
  apiKey: "AIzaSyBFkKWV7rw_WlXjID4JOcuommqIK8AHrJI",
  authDomain: "week4-firebase-6714f.firebaseapp.com",
  databaseURL: "https://week4-firebase-6714f-default-rtdb.firebaseio.com",
  projectId: "week4-firebase-6714f",
  storageBucket: "week4-firebase-6714f.firebasestorage.app",
  messagingSenderId: "175577793195",
  appId: "1:175577793195:web:5151481a064ecac722adee",
  measurementId: "G-W74JCY2K3B"
};



    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);

    const messagesRef = ref(database, "messages");


    window.saveMessage = function() {

        const input = document.getElementById("messageInput");

        const message = input.value.trim();

        if (message === "") {
            return;
        }

        push(messagesRef, {
            text: message,
            time: new Date().toISOString()
        });

        input.value = "";
    };


    onValue(messagesRef, (snapshot) => {

        const list = document.getElementById("messageList");

        list.innerHTML = "";

        snapshot.forEach((child) => {

            const data = child.val();

            const li = document.createElement("li");

            li.textContent = data.text;

            list.appendChild(li);

        });

    });

</script>

</body>
</html>
